<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hinos Jovens Atos do Espírito</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Hinos Jovens Atos do Espírito</h1>
    <p>Pasta online de hinos para jovens</p>
  </header>

  <main>
    <section id="homePage">
      <div class="top-bar">
        <h2>Lista de Hinos</h2>
        <button onclick="addHino()" title="Adicionar novo hino">+</button>
      </div>

      <div id="hinosList"></div>
    </section>

    <section id="hinoPage" class="hidden">
      <button class="back-btn" onclick="goHome()">← Voltar</button>

      <div class="hino-header">
        <h2 id="hinoTitle"></h2>
        <button id="editBtn" class="edit-icon-btn" onclick="enableEdit()" title="Editar hino">✏️ Editar</button>
      </div>

      <div id="editTools" class="edit-tools hidden">
        <button id="colorBtn" onclick="changeColor()">Cor da letra</button>
        <button id="increaseFontBtn" onclick="increaseFont()">A+</button>
        <button id="decreaseFontBtn" onclick="decreaseFont()">A-</button>
        <button id="saveBtn" onclick="saveHino()">Salvar</button>
      </div>

      <div id="hinoLyrics" class="hino-lyrics" contenteditable="false"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
