<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hinos Jovens Atos do Espírito</title>
  <meta name="theme-color" content="#1f4f3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Hinos Jovens" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Hinos Jovens Atos do Espírito</h1>
    <p>Pasta online de hinos para jovens</p>
    <p id="connectionStatus">Verificando conexão...</p>
    <div class="install-actions">
      <button id="installBtn" class="install-btn hidden" type="button">📲 Instalar app</button>
      <p id="installStatus" class="install-hint hidden"></p>
      <p id="iosInstallHint" class="install-hint hidden"></p>
    </div>
  </header>

  <main>
    <section id="homePage">
      <div class="top-bar">
        <h2 id="listTitle">Lista de Hinos do Coral</h2>
        <button onclick="addHino()" title="Adicionar nova música">+</button>
      </div>

      <nav class="tabs" aria-label="Selecionar lista de músicas">
        <button id="coralTab" class="tab active" type="button" onclick="selectCategory('coral')">Coral</button>
        <button id="bandaTab" class="tab" type="button" onclick="selectCategory('banda')">Banda</button>
      </nav>

      <div id="hinosList"></div>
    </section>

    <section id="hinoPage" class="hidden">
      <button class="back-btn" onclick="goHome()">← Voltar</button>

      <div class="hino-header">
        <div class="hino-title-area">
          <h2 id="hinoTitle"></h2>
          <label id="titleEditLabel" class="edit-label hidden" for="hinoTitleInput">Título do hino</label>
          <input id="hinoTitleInput" class="title-input hidden" type="text" maxlength="120" />
        </div>
        <button id="editBtn" class="edit-icon-btn" onclick="enableEdit()" title="Editar hino">✏️ Editar</button>
      </div>

      <div id="editTools" class="edit-tools hidden">
        <button id="cardColorBtn" onclick="toggleCardColorPalette()">Cor do card</button>
        <button id="colorBtn" onclick="toggleColorPalette()">Cor da letra</button>
        <button id="increaseFontBtn" onclick="increaseFont()">A+</button>
        <button id="decreaseFontBtn" onclick="decreaseFont()">A-</button>
        <button id="saveBtn" onclick="saveHino()">Salvar</button>
      </div>
      <div id="cardColorPalette" class="color-palette hidden" aria-label="Escolher cor do card">
        <button class="color-swatch" style="background:#ffffff" onclick="applyCardColor('#ffffff')" title="Branco"></button>
        <button class="color-swatch" style="background:#fbe9e7" onclick="applyCardColor('#fbe9e7')" title="Rosa claro"></button>
        <button class="color-swatch" style="background:#fff8e1" onclick="applyCardColor('#fff8e1')" title="Amarelo claro"></button>
        <button class="color-swatch" style="background:#e8f5e9" onclick="applyCardColor('#e8f5e9')" title="Verde claro"></button>
        <button class="color-swatch" style="background:#e3f2fd" onclick="applyCardColor('#e3f2fd')" title="Azul claro"></button>
        <button class="color-swatch" style="background:#ede7f6" onclick="applyCardColor('#ede7f6')" title="Roxo claro"></button>
        <button class="color-swatch" style="background:#1f4f3a" onclick="applyCardColor('#1f4f3a')" title="Verde escuro"></button>
      </div>
      <div id="colorPalette" class="color-palette hidden" aria-label="Escolher cor da letra">
        <button class="color-swatch" style="background:#d32f2f" onclick="applySelectedColor('#d32f2f')" title="Vermelho"></button>
        <button class="color-swatch" style="background:#f57c00" onclick="applySelectedColor('#f57c00')" title="Laranja"></button>
        <button class="color-swatch" style="background:#fbc02d" onclick="applySelectedColor('#fbc02d')" title="Amarelo"></button>
        <button class="color-swatch" style="background:#388e3c" onclick="applySelectedColor('#388e3c')" title="Verde"></button>
        <button class="color-swatch" style="background:#1976d2" onclick="applySelectedColor('#1976d2')" title="Azul"></button>
        <button class="color-swatch" style="background:#7b1fa2" onclick="applySelectedColor('#7b1fa2')" title="Roxo"></button>
        <button class="color-swatch" style="background:#000000" onclick="applySelectedColor('#000000')" title="Preto"></button>
      </div>

      <div id="hinoLyrics" class="hino-lyrics" contenteditable="false"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
