    * {

    }

    body {
      background: #f3f0e8;
      color: #2f2f2f;

      padding: 20px;
    }

      max-width: 760px;

      background: #fffaf0;

      border-bottom: 1px solid #e2d6bd;
      margin-bottom: 22px;
    }

      font-size: 32px;
      margin-bottom: 8px;
      color: #3b2f20;
    }

    .cover p {
      color: #776b5a;
      font-size: 17px;
    }

    .song-list {
      display: grid;
      gap: 12px;
    }

    .song-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      cursor: pointer;
      text-align: left;
      background: #efe3c8;
      color: #2f2f2f;
      transition: 0.2s;
    }

    .song-button:hover {
      background: #e0cfaa;
    }

    .song-page {
      display: none;
    }

    .song-title {
      font-size: 27px;
      color: #3b2f20;
      margin-bottom: 16px;
    }

    .lyrics {
      white-space: pre-line;
      font-size: 18px;
      line-height: 1.7;
      background: #ffffff;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #eadfc8;
      margin-bottom: 20px;
    }

    .back-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      cursor: pointer;
      background: #3b2f20;
      color: white;
    }

    .back-button:hover {
      background: #5a472f;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #8a7b67;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 18px;
      }

      .cover h1 {
        font-size: 26px;
      }

      .lyrics {
        font-size: 17px;
      }
    }
  </style>

    const songList = document.getElementById("song-list");
    const homePage = document.getElementById("home-page");
    const songPage = document.getElementById("song-page");
    const songTitle = document.getElementById("song-title");
    const songLyrics = document.getElementById("song-lyrics");

    songs.forEach((song, index) => {
      const button = document.createElement("button");
      button.className = "song-button";
      button.innerText = song.title;
      button.onclick = () => openSong(index);
      songList.appendChild(button);
    });

    function openSong(index) {
      songTitle.innerText = songs[index].title;
      songLyrics.innerText = songs[index].lyrics;
      homePage.style.display = "none";
      songPage.style.display = "block";
      window.scrollTo(0, 0);
    }

    function goBack() {
      songPage.style.display = "none";
      homePage.style.display = "block";
      window.scrollTo(0, 0);
    }
