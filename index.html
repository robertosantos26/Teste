<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hinos Jovens Atos do Espírito</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Hinos Jovens Atos do Espírito</h1>
    <p>Pasta online de hinos para jovens</p>
  </header>

  <main>
    <section id="homePage">
      <div class="top-bar">
        <h2>Lista de Hinos</h2>
        <button onclick="addHino()">+</button>
      </div>

      <div id="hinosList"></div>
    </section>

    <section id="hinoPage" class="hidden">
      <button class="back-btn" onclick="goHome()">← Voltar</button>

      <h2 id="hinoTitle"></h2>

      <div class="edit-bar">
        <button onclick="enableEdit()">Editar</button>
        <button onclick="changeColor()">Cor da letra</button>
        <button onclick="increaseFont()">A+</button>
        <button onclick="decreaseFont()">A-</button>
        <button onclick="saveHino()">Salvar</button>
      </div>

      <textarea id="hinoLyrics" disabled></textarea>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
